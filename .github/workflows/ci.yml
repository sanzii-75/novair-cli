name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check nexa tests

      - name: Test (pytest)
        run: pytest

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install .
      - name: Mock server end-to-end
        run: |
          python examples/mock_server.py --port 8931 &
          sleep 1
          export NEXA_BASE_URL=http://127.0.0.1:8931/v1 NEXA_API_KEY=mock NEXA_MODEL=mock-small
          nexa run "hello" | tee out.txt
          grep -q "Hello from the nexa mock server" out.txt
          nexa run --yolo "please list the files" | tee out2.txt
          grep -q "exit_code=0" out2.txt
          nexa providers
          nexa models
